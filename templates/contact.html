<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us -  Yoga Dhara Studio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #f9fafb;
      color: #111827;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #1f2937;
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: #374151;
      font-weight: 500;
    }

    .get-started {
      background-color: #8b5cf6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }

    .contact-container {
      max-width: 600px;
      margin: 4rem auto;
      padding: 2rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .contact-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px 12px 0 0;
      margin-bottom: 1.5rem;
    }

    .contact-container h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .contact-container p {
      margin-bottom: 2rem;
      color: #6b7280;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .contact-form label {
      font-weight: 600;
      color: #374151;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    .contact-form button {
      background-color: #10b981;
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    .contact-form button:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <header>
    <div class="navbar">
      <h1 class="logo">Yoga Dhara</h1>
      <nav>
        <ul>
          <li><a href="{% url 'home' %}">Home</a></li>
          <li><a href="{% url 'services' %}">Attendance</a></li>
          <li><a href="{% url 'about' %}">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contact-container">
    <img src="static/hello/images/chelsea-gates-n8L1VYaypcw-unsplash.jpg" alt="Yoga studio" class="contact-image" />
    <h2>Contact Us</h2>
    <p>Feel free to contact us with any questions or feedback you may have.</p>
    <form class="contact-form" method="post" action="/contact">
      {% csrf_token %}
      <label for="name">Name</label>
      <input type="text" name="name" id="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" name="email" id="email" placeholder="Your email" required />

      <label for="message">Message</label>
      <textarea id="message" name="description" rows="5" placeholder="Your message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow" role="alert" style="z-index: 1100; min-width: 300px;">
      <strong>{{ message|capfirst }}</strong>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
{% endif %}

  <!-- Bootstrap JS and Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  
</body>
</html>
