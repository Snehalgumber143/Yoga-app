<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instructor Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(135deg, #edeaff, #f7f5ff);
}

/* LOGIN GLASS CARD */
.login-box {
  width: 360px;
  padding: 2.2rem;

  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.45),
    rgba(255, 255, 255, 0.2)
  );

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.35);

  box-shadow:
    0 25px 50px rgba(124, 106, 230, 0.35),
    inset 0 1px 1px rgba(255, 255, 255, 0.4);
}

/* TITLE */
.login-box h2 {
  text-align: center;
  margin-bottom: 1.8rem;

  font-weight: 600;
  color: #4b3fbf;
}

/* ERROR */
.error {
  background: rgba(255, 80, 80, 0.15);
  color: #b91c1c;
  padding: 0.6rem;
  border-radius: 10px;
  text-align: center;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

/* FORM */
form p {
  margin-bottom: 1.2rem;
}

/* LABEL */
label {
  display: block;
  font-size: 0.85rem;
  font-weight: 500;
  color: #5b52c6;
  margin-bottom: 0.4rem;
}

/* INPUTS */
input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 0.85rem 1rem;

  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.45);

  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(10px);

  font-size: 0.95rem;
  outline: none;

  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.6),
    0 8px 20px rgba(124, 106, 230, 0.15);

  transition: all 0.25s ease;
}

input:focus {
  background: rgba(255, 255, 255, 0.8);
  border-color: rgba(124, 106, 230, 0.7);

  box-shadow:
    0 0 0 3px rgba(124, 106, 230, 0.25),
    0 10px 30px rgba(124, 106, 230, 0.25);
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 0.5rem;

  padding: 0.9rem;
  border: none;
  border-radius: 999px;

  background: linear-gradient(135deg, #7c6ae6, #a79bff);
  color: #fff;

  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.3px;

  cursor: pointer;

  box-shadow:
    0 12px 30px rgba(124, 106, 230, 0.5),
    inset 0 1px 1px rgba(255, 255, 255, 0.4);

  transition: all 0.25s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow:
    0 18px 40px rgba(124, 106, 230, 0.65);
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Instructor Login</h2>

  {% if form.errors %}
    <div class="error">
      Invalid username or password. Please try again.
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <p>
      <label>Username</label>
      <input type="text" name="username" required>
    </p>

    <p>
      <label>Password</label>
      <input type="password" name="password" required>
    </p>

    <button type="submit">Login</button>
  </form>
</div>

</body>
</html>
